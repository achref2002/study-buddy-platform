<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline — Study Buddy</title>
    <style>
      body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f8fafc;color:#0f172a}
      .card{max-width:520px;padding:2rem;border-radius:12px;background:#ffffff;box-shadow:0 6px 24px rgba(2,6,23,0.08);text-align:center}
      h1{margin:0 0 .5rem;font-size:1.25rem}
      p{margin:0;color:#475569}
      a.button{display:inline-block;margin-top:1rem;padding:.5rem 1rem;border-radius:8px;background:#0ea5a4;color:white;text-decoration:none}
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Vous êtes hors ligne</h1>
      <p>Study Buddy n'est pas connecté à Internet. Certaines fonctionnalités (vidéo, recherche, sauvegarde) ne sont pas disponibles.</p>
      <p>Vous pouvez consulter le contenu mis en cache ou réessayer.</p>
      <a class="button" href="/">Retour à l'accueil</a>
    </main>
  </body>
</html>
